blueprint:
  name: Auto Off After Duration
  description: Turns off selected entities once they have been on for the configured duration
  domain: automation
  input:
    auto_off_entities:
      name: Entities
      description: Select the entities that should be turned off automatically once they have been on for the configured duration
      selector:
        entity:
          domain:
            - light
            - switch
          multiple: true
    timeout_duration:
      name: Turn off after
      description: How long the selected entities can stay on before being turned off
      default:
        minutes: 30
      selector:
        duration: {}

triggers:
  - trigger: state
    entity_id: !input auto_off_entities
    to: "on"
    for: !input timeout_duration

conditions: []

actions:
  - action: homeassistant.turn_off
    target:
      entity_id: "{{ trigger.entity_id }}"
  - action: logbook.log
    data:
      name: Auto Off
      message: >-
        Automatically turned off
        {{ state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id }}
      entity_id: "{{ trigger.entity_id }}"

mode: queued
max: 10
