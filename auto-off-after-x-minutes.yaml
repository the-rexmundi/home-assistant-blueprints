blueprint:
  name: Auto Off After X Minutes
  description: Automatically turns off specified lights/switches after they have been on for X minutes or more
  domain: automation
  input:
    light_entities:
      name: Light Entities
      description: Select the lights that should be automatically turned off
      selector:
        entity:
          domain: 
            - light
            - switch
          multiple: true
    timeout_duration:
      name: Timeout Duration
      description: How long lights can stay on before being automatically turned off (in minutes)
      default: 30
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: "minutes"
          

variables:
  light_entities: !input entities
  timeout_minutes: !input timeout_duration


trigger:
  - platform: time_pattern
    minutes: "*"
    


condition: []

action:
  - repeat:
      for_each: "{{ entities }}"
      sequence:
        - variables:
            entity: "{{ repeat.item }}"
            current_time: "{{ now() }}"
            state: "{{ states(entity) }}"
            last_changed: "{{ states[entity].last_changed }}"
            time_diff_minutes: "{{ ((as_timestamp(current_time) - as_timestamp(last_changed))/ 60) | int }}"
        - condition: template
          value_template: "{{ state == 'on' and time_diff_minutes >= timeout_minutes }}"
        - service: homeassistant.turn_off
          target:
            entity_id: "{{ entity }}"
        - service: logbook.log
          data:
            name: "Auto Off"
            message: "Automatically turned off {{ state_attr(entity, 'friendly_name') or entity }} after {{ time_diff_minutes }} minutes"

mode: single
max_exceeded: silent
